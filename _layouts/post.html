---
layout: default
---

<article>
        <header>
            {% if page.header_img %}<img class="header-img" loading="eager" src="{{ page.header_img }}">{% endif %}
            <p>{{ page.date | date_to_string }} by 0xE2</p>
            <h1>{{ page.title }}</h1>
        </header>

        {{ content }}
</article>
